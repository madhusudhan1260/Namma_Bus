version: '3.8'

services:
  nammablr-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nammablr-backend
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=production
      - TRANSIT_PROVIDER=mock
      - REALTIME_POLL_INTERVAL_SECONDS=10.0
      - REALTIME_STALE_THRESHOLD_SECONDS=60.0
      - RATE_LIMIT_PER_MINUTE=120
      - MAX_REQUEST_BODY_BYTES=1048576
      - CORS_ALLOWED_ORIGINS=https://nammablr.transit.gov.in,https://app.nammablr.in,http://localhost:8081,http://localhost:8082
      # Optional authorized GTFS / GTFS-RT credentials:
      # - BMTC_API_ENDPOINT=https://authorized-feeds.bmtc.gov.in/gtfs-rt
      # - BMTC_API_KEY=your-authorized-secret-key
      # - GTFS_STATIC_DIR=/data/gtfs_static
    volumes:
      - gtfs_data:/data/gtfs_static:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  gtfs_data:
    name: nammablr_gtfs_data
